# Yerel geliştirme veritabanı. Backend VS Code'dan ya da `dotnet run` ile çalışır.
#   docker compose up -d --wait
# Değerler kökteki isteğe bağlı .env dosyasıyla değiştirilebilir.
services:
  db:
    image: postgres:16-alpine
    container_name: roomly-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roomly}
      POSTGRES_USER: ${POSTGRES_USER:-roomly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomly_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - roomly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roomly} -d ${POSTGRES_DB:-roomly}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roomly-pgdata:
